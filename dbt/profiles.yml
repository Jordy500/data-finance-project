data_finance:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: analytics
      location: EU
      threads: 4
      job_execution_timeout_seconds: 300
    ci:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      keyfile: "{{ env_var('GCP_KEYFILE_PATH') }}"
      dataset: analytics_ci
      location: EU
      threads: 4
      job_execution_timeout_seconds: 300
