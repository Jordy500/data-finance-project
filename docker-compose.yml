# réglages communs à toutes les étapes
x-commun: &commun
  build: .
  image: data-finance
  environment:
    GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    GOOGLE_APPLICATION_CREDENTIALS: /tmp/adc.json
  volumes:
    - ${HOME}/.config/gcloud/application_default_credentials.json:/tmp/adc.json:ro
    - ./data:/app/data

services:
  collect:
    <<: *commun
    command: python src/collect.py

  load:
    <<: *commun
    command: python src/load_bigquery.py

  dbt-run:
    <<: *commun
    working_dir: /app/dbt
    command: dbt run

  dbt-test:
    <<: *commun
    working_dir: /app/dbt
    command: dbt test

  export:
    <<: *commun
    command: python src/export_csv.py

  # toute la chaîne à la suite
  pipeline:
    <<: *commun
    command: >
      sh -c "python src/collect.py
      && python src/load_bigquery.py
      && (cd dbt && dbt run && dbt test)
      && python src/export_csv.py"
